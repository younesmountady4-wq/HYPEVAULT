<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HYPEVAULT | Vintage & Streetwear Archive</title>
<style>
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }
  body {
    background: #080808;
    color: #f5f5f5;
    font-family: 'Segoe UI', Arial, sans-serif;
    overflow-x: hidden;
  }

  /* =========================================
     PORTA BLINDATA CAVEAU (VAULT ENTRY)
     ========================================= */
  #vault-overlay {
    position: fixed;
    inset: 0;
    z-index: 9999;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
    transition: opacity 0.8s ease, visibility 0.8s ease;
  }
  #vault-overlay.opened {
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
  }

  /* Due ante scorrevoli d'acciaio dietro la porta rotonda */
  .vault-wall {
    position: absolute;
    top: 0;
    width: 50%;
    height: 100%;
    background: linear-gradient(135deg, #1b1d20 0%, #0e0f11 50%, #17191c 100%);
    border-right: 2px solid #2b2e33;
    box-shadow: inset 0 0 80px rgba(0,0,0,0.9);
    transition: transform 1.2s cubic-bezier(0.77, 0, 0.175, 1) 0.6s;
  }
  .vault-wall.left {
    left: 0;
    background-image: repeating-linear-gradient(90deg, rgba(255,255,255,0.015) 0px, rgba(255,255,255,0.015) 2px, transparent 2px, transparent 6px), linear-gradient(135deg, #1e2024, #0c0d0f);
  }
  .vault-wall.right {
    right: 0;
    border-right: none;
    border-left: 2px solid #2b2e33;
    background-image: repeating-linear-gradient(90deg, rgba(255,255,255,0.015) 0px, rgba(255,255,255,0.015) 2px, transparent 2px, transparent 6px), linear-gradient(225deg, #1e2024, #0c0d0f);
  }
  #vault-overlay.unlocking .vault-wall.left {
    transform: translateX(-100%);
  }
  #vault-overlay.unlocking .vault-wall.right {
    transform: translateX(100%);
  }

  /* La mega porta circolare in acciaio */
  .vault-door {
    position: relative;
    z-index: 2;
    width: 380px;
    height: 380px;
    border-radius: 50%;
    background: radial-gradient(circle at 30% 30%, #4a4e54 0%, #23262b 45%, #111315 85%, #070809 100%);
    border: 14px solid #2f333a;
    box-shadow:
      0 0 0 6px #121316,
      0 25px 70px rgba(0, 0, 0, 0.95),
      inset 0 4px 15px rgba(255, 255, 255, 0.25),
      inset 0 -10px 25px rgba(0, 0, 0, 0.9);
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    transition: transform 1.2s cubic-bezier(0.77, 0, 0.175, 1) 0.6s, opacity 0.8s ease 0.8s;
  }
  #vault-overlay.unlocking .vault-door {
    transform: scale(1.15);
    opacity: 0;
  }

  /* Anello interno con rivetti metallici */
  .vault-ring {
    position: absolute;
    inset: 18px;
    border-radius: 50%;
    border: 3px dashed rgba(255, 255, 255, 0.18);
    box-shadow: inset 0 0 25px rgba(0, 0, 0, 0.85);
    pointer-events: none;
  }

  /* Cerniere pesanti laterali */
  .vault-hinge {
    position: absolute;
    right: -36px;
    width: 44px;
    height: 55px;
    background: linear-gradient(180deg, #3c4047, #181a1d);
    border: 2px solid #4e535c;
    border-radius: 6px;
    box-shadow: 0 6px 15px rgba(0,0,0,0.8);
  }
  .vault-hinge.top { top: 75px; }
  .vault-hinge.bottom { bottom: 75px; }

  /* Display digitale sul caveau */
  .vault-screen {
    background: #050a07;
    border: 2px solid #2c3531;
    padding: 6px 16px;
    border-radius: 6px;
    color: #00ff88;
    font-family: 'Courier New', monospace;
    font-size: 13px;
    font-weight: bold;
    letter-spacing: 2px;
    text-shadow: 0 0 8px #00ff88;
    margin-bottom: 18px;
    box-shadow: inset 0 0 10px rgba(0, 255, 136, 0.2);
  }

  /* Timone / Manovella centrale rotante */
  .vault-wheel {
    width: 150px;
    height: 150px;
    border-radius: 50%;
    border: 12px solid #6b717a;
    background: radial-gradient(circle, #3c4047 0%, #1a1c20 100%);
    box-shadow:
      0 8px 20px rgba(0,0,0,0.85),
      inset 0 2px 6px rgba(255,255,255,0.4);
    position: relative;
    display: flex;
    justify-content: center;
    align-items: center;
    cursor: pointer;
    transition: transform 0.8s cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  .vault-wheel:hover {
    border-color: #00ff88;
    box-shadow: 0 0 25px rgba(0, 255, 136, 0.35), inset 0 2px 6px rgba(255,255,255,0.4);
  }
  #vault-overlay.unlocking .vault-wheel {
    transform: rotate(360deg);
  }

  .spoke {

    width: 100%;

    background: linear
