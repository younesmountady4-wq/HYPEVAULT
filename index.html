<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HYPEVAULT | Official Vintage & Streetwear Archive</title>
<style>
  :root {
    --bg-dark: #060606;
    --bg-card: #101010;
    --bg-elevated: #181818;
    --border-color: #242424;
    --neon: #00ff88;
    --neon-hover: #00cc6a;
    --danger: #ff2a55;
    --text-main: #f5f5f5;
    --text-muted: #999999;
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  html {
    scroll-behavior: smooth;
  }

  body {
    background-color: var(--bg-dark);
    color: var(--text-main);
    font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    line-height: 1.6;
    overflow-x: hidden;
  }

  /* =========================================
     BARRA SUPERIORE PROMO & TICKER
  ========================================= */
  .top-announcement {
    background: var(--neon);
    color: #000;
    text-align: center;
    padding: 8px 15px;
    font-size: 12px;
    font-weight: 800;
    letter-spacing: 1.2px;
    text-transform: uppercase;
    position: relative;
    z-index: 200;
  }

  /* =========================================
     NAVBAR PRINCIPALE
  ========================================= */
  nav {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 18px 40px;
    background: rgba(10, 10, 10, 0.92);
    backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--border-color);
    position: sticky;
    top: 0;
    z-index: 150;
  }

  .logo {
    font-size: 26px;
    font-weight: 900;
    letter-spacing: 3px;
    color: #fff;
    text-decoration: none;
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .logo span {
    color: var(--neon);
  }

  .nav-links {
    display: flex;
    gap: 28px;
    align-items: center;
  }

  .nav-links a {
    color: #ccc;
    text-decoration: none;
    font-size: 13px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 1.2px;
    transition: color 0.25s ease;
  }

  .nav-links a:hover {
    color: var(--neon);
  }

  .cart-trigger {
    background: var(--bg-elevated);
    border: 1px solid #333;
    color: #fff;
    padding: 8px 16px;
    border-radius: 25px;
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 8px;
    transition: 0.25s;
  }

  .cart-trigger:hover {
    border-color: var(--neon);
    color: var(--neon);
  }

  .cart-badge {
    background: var(--neon);
    color: #000;
    padding: 2px 8px;
    border-radius: 12px;
    font-size: 12px;
    font-weight: 900;
  }

  /* =========================================
     CASSAFORTE CIRCOLARE GRANDE (HERO SECTION)
  ========================================= */
  .vault-hero {
    min-height: 75vh;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
    padding: 70px 20px;
    background: radial-gradient(circle at center, #1e1e1e 0%, #060606 75%);
    border-bottom: 1px solid var(--border-color);
    position: relative;
  }

  .vault-status-pill {
    background: rgba(0, 255, 136, 0.08);
    border: 1px solid rgba(0, 255, 136, 0.3);
    color: var(--neon);
    padding: 6px 16px;
    border-radius: 20px;
    font-size: 11px;
    font-weight: 800;
    letter-spacing: 2px;
    text-transform: uppercase;
    margin-bottom: 25px;
  }

  .bank-vault-door {
    width: 230px;
    height: 230px;
    margin: 0 auto 30px;
    border-radius: 50%;
    background: radial-gradient(circle, #2b2b2b 0%, #101010 72%);
    border: 12px solid #383838;
    box-shadow: 
      0 0 0 5px #0c0c0c,
      0 0 40px rgba(0, 255, 136, 0.22),
      inset 0 0 30px rgba(0, 0, 0, 0.95);
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: transform 1.4s cubic-bezier(0.22, 1, 0.36, 1), border-color 0.6s ease, box-shadow 0.6s ease;
  }

  .bank-vault-door::before {
    content: "";
    position: absolute;
    width: 184px;
    height: 184px;
    border-radius: 50%;
    border: 3px dashed #555;
    animation: spinVaultRing 24s linear infinite;
  }

  .vault-spoke {
    position: absolute;
    width: 100%;
    height: 7px;
    background: linear-gradient(90deg, #222, #555, #222);
    z-index: 1;
  }

  .vault-spoke.s2 { transform: rotate(90deg); }
  .vault-spoke.s3 { transform: rotate(45deg); }
  .vault-spoke.s4 { transform: rotate(-45deg); }

  .vault-center-hub {
    width: 104px;
    height: 104px;
    border-radius: 50%;
    background: #0b0b0b;
    border: 4px solid var(--neon);
    z-index: 3;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    box-shadow: 0 0 18px rgba(0, 255, 136, 0.35);
  }

  .vault-center-hub strong {
    font-size: 13px;
    font-weight: 900;
    letter-spacing: 2px;
    color: var(--neon);
  }

  .vault-center-hub span {
    font-size: 9px;
    color: #888;
    letter-spacing: 1px;
    margin-top: 2px;
  }

  @keyframes spinVaultRing {
    0% { transform: rotate(0deg); }
    100% { transform: rotate(360deg); }
  }

  .vault-hero h1 {
    font-size: 58px;
    font-weight: 900;
    letter-spacing: 6px;
    margin-bottom: 12px;
    text-transform: uppercase;
    text-shadow: 0 0 30px rgba(0, 255, 136, 0.15);
  }

  .vault-hero p {
    color: var(--text-muted);
    max-width: 540px;
    margin: 0 auto 30px;
    font-size: 16px;
  }

  .vault-unlock-form {
    display: flex;
    justify-content: center;
    gap: 10px;
    max-width: 460px;
    width: 100%;
    margin: 0 auto;
  }

  .vault-unlock-form input {
    flex: 1;
    padding: 15px 20px;
    background: #111;
    border: 1px solid #333;
    border-radius: 30px;
    color: #fff;
    font-size: 14px;
    outline: none;
    transition: 0.25s;
  }

  .vault-unlock-form input:focus {
    border-color: var(--neon);
  }

  .btn-primary {
    padding: 15px 26px;
    background: var(--neon);
    color: #000;
    border: none;
    border-radius: 30px;
    font-weight: 900;
    font-size: 13px;
    text-transform: uppercase;
    letter-spacing: 1px;
    cursor: pointer;
    transition: 0.25s;
  }

  .btn-primary:hover {
    background: var(--neon-hover);
    box-shadow: 0 0 22px rgba(0, 255, 136, 0.45);
  }

  #vault-unlocked-banner {
    display: none;
    background: rgba(0, 255, 136, 0.1);
    border: 1px solid var(--neon);
    color: var(--neon);
    padding: 12px 24px;
    border-radius: 30px;
    font-weight: 800;
    font-size: 14px;
    margin-top: 15px;
  }

  /* =========================================
     CONTENITORE GENERALE E INTESTAZIONI
  ========================================= */
  .container {
    max-width: 1240px;
    margin: 0 auto;
    padding: 60px 25px;
  }

  .section-header {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    flex-wrap: wrap;
    gap: 15px;
    margin-bottom: 30px;
  }

  .section-title {
    font-size: 26px;
    font-weight: 900;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    border-left: 4px solid var(--neon);
    padding-left: 15px;
  }

  .section-subtitle {
    color: var(--text-muted);
    font-size: 14px;
  }

  /* =========================================
     SEZIONE LOOKBOOK (3 FOTO INIZIALI)
  ========================================= */
  .lookbook-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 22px;
    margin-bottom: 80px;
  }

  .look-card {
    position: relative;
    border-radius: 16px;
    overflow: hidden;
    border: 1px solid var(--border-color);
    background: var(--bg-card);
    height: 430px;
    cursor: pointer;
  }

  .look-card img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
    transition: transform 0.5s ease;
  }

  .look-card:hover img {
    transform: scale(1.05);
  }

  .look-overlay {
    position: absolute;
    inset: 0;
    background: linear-gradient(to top, rgba(0,0,0,0.85) 0%, transparent 50%);
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    padding: 20px;
  }

  .look-badge {
    background: rgba(10, 10, 10, 0.9);
    color: var(--neon);
    border: 1px solid rgba(0, 255, 136, 0.4);
    padding:
