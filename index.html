  body { background: #080808; color: #f5f5f5; font-family: Arial, sans-serif; }

  .badge-cart { background: #00ff88; color: #000; padding: 2px 7px; border-radius: 10px; font-size: 12px; }

  .vault-hero {

  .vault-wheel {

  @keyframes spinVault {

    100% { transform: rotate(360deg); }

  .card-body { padding: 18px; }

  .price-box { margin-bottom: 14px; }
  .old { text-decoration: line-through; color: #666; font-size: 13px; margin-right: 8px; }
  .new { color: #00ff88; font-weight: bold; font-size: 18px; }
  .btn-buy { width: 100%; padding: 10px; background: #1e1e1e; color: #fff; border: 1px solid #333; border-radius: 6px; font-weight: bold; cursor: pointer; }
  .btn-buy:hover:not(:disabled) { background: #00ff88; color: #000; }
  .btn-buy:disabled { opacity: 0.5; cursor: not-allowed; }
  .restock { display: none; font-size: 12px; color: #ff6b88; margin-top: 8px; }
