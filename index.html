<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HYPEVAULT</title>
<style>
body{
  margin:0;
  background:#0a0a0a;
  color:white;
  font-family:Arial,sans-serif;
}
.hero{
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  flex-direction:column;
  background:linear-gradient(#555,#111);
  text-align: center;
  padding: 0 20px;
}
h1{
  font-size:60px;
  margin-bottom: 10px;
  letter-spacing: 2px;
}
p {
  color: #ccc;
  font-size: 18px;
  margin-bottom: 30px;
}
button{
  padding:15px 35px;
  background:#00ff88;
  border:none;
  border-radius:30px;
  font-weight:bold;
  cursor: pointer;
  font-size: 16px;
  transition: 0.3s;
}
button:hover {
  background: #00cc6a;
  transform: scale(1.05);
}
</style>
</head>
<body>
<div class="hero">
  <h1>HYPEVAULT</h1>
  <p>ENTER THE VAULT. OWN THE HYPE.</p>
  <button>ENTER</button>
</div>
</body>
</html>
