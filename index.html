<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>HYPEVAULT</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:linear-gradient(
180deg,
#9c9c9c 0%,
#5d5d5d 30%,
#232323 100%
);
color:white;
overflow-x:hidden;
}

/* INTRO */

.intro{
height:100vh;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
animation:fadeOut 4s forwards;
animation-delay:3s;
position:fixed;
width:100%;
z-index:999;
background:#111;
}

.vault{
width:250px;
height:250px;
border-radius:50%;

background:
radial-gradient(
circle,
#bfbfbf,
#7d7d7d,
#383838
);

border:10px solid white;

animation:openVault 3s ease forwards;
}

.logo-intro{
font-size:80px;
font-weight:900;
margin-top:40px;

background:
linear-gradient(
45deg,
#ffffff,
#d0d0d0,
#ffffff
);

-webkit-background-clip:text;
-webkit-text-fill-color:transparent;
}

/* NAVBAR */

header{
position:fixed;
width:100%;
top:0;
padding:20px 60px;

display:flex;
justify-content:space-between;
align-items:center;

backdrop-filter:blur(20px);

z-index:100;
}

header h2{
font-size:30px;
}

nav a{
text-decoration:none;
color:white;
margin-left:20px;
font-weight:bold;
}

nav a:hover{
color:silver;
}

/* HERO */

.hero{
height:100vh;

display:flex;
justify-content:center;
align-items:center;
flex-direction:column;

text-align:center;
}

.hero h1{
font-size:120px;
letter-spacing:8px;

animation:rise 1.5s ease;
}

.hero p{
font-size:25px;
color:#e0e0e0;
margin-top:10px;
}

.btn{

margin-top:30px;

padding:18px 40px;

background:white;
color:black;

border-radius:40px;

text-decoration:none;
font-weight:bold;

transition:0.4s;
}

.btn:hover{

transform:translateY(-5px);

box-shadow:0 0 30px white;

}

/* TRENDING */

.products{
padding:100px 10%;
}

.products h2{
font-size:60px;
margin-bottom:40px;
}

.grid{

display:grid;

grid-template-columns:
repeat(auto-fit,minmax(250px,1fr));

gap:25px;

}

.card{

background:
rgba(255,255,255,.1);

backdrop-filter:blur(20px);

padding:30px;

border-radius:20px;

transition:.4s;
}

.card:hover{

transform:translateY(-10px);

background:
rgba(255,255,255,.2);
}

.price{
margin-top:15px;
font-size:22px;
font-weight:bold;
}

footer{

padding:50px;
text-align:center;

}

/* ANIMATIONS */

@keyframes rise{

from{
opacity:0;
transform:translateY(50px);
}

to{
opacity:1;
transform:translateY(0);
}

}

@keyframes openVault{

0%{
transform:rotate(0deg);
}

100%{
transform:
translateX(-400px)
rotate(-120deg);
}

}

@keyframes fadeOut{

0%,70%{
opacity:1;
}

100%{
opacity:0;
visibility:hidden;
}

}

</style>
</head>

<body>

<div class="intro">

<div class="vault"></div>

<div class="logo-intro">
HYPEVAULT
</div>

</div>

<header>

<h2>HYPEVAULT</h2>

<nav>

<a href="hoodies.html">HOODIES</a>
<a href="bottoms.html">BOTTOMS</a>
<a href="jackets.html">JACKETS</a>
<a href="cart.html">CART</a>

</nav>

</header>

<section class="hero">

<h1>HYPEVAULT</h1>

<p>
RARE STREETWEAR.
STORED SECURELY.
</p>

<a href="#shop" class="btn">
ENTER THE VAULT
</a>

</section>

<section class="products" id="shop">

<h2>TRENDING THIS WEEK</h2>

<div class="grid">

<div class="card">
<h3>Corteiz Hoodie</h3>
<p class="price">€149</p>
</div>

<div class="card">
<h3>Denim Tears</h3>
<p class="price">€189</p>
</div>

<div class="card">
<h3>Stüssy Jacket</h3>
<p class="price">€220</p>
</div>

<div class="card">
<h3>Cargo Utility</h3>
<p class="price">€99</p>
</div>

</div>

</section>

<footer>

<h2>HYPEVAULT</h2>

<p>ENTER THE VAULT. OWN THE HYPE.</p>

</footer>

</body>
</html>
