<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HYPEVAULT - Enter the Vault</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family: 'Segoe UI', Arial, sans-serif;
}

body{
  background: #0a0a0a;
  color: white;
  overflow-x: hidden;
}

body.locked {
  overflow: hidden;
}

/* SCHERMATA CASSAFORTE */
.intro{
  height: 100vh;
  width: 100%;
  position: fixed;
  top: 0;
  left: 0;
  z-index: 9999;
  background: #111;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  perspective: 1200px;
  cursor: pointer;
  transition: opacity 0.8s ease 1.3s, visibility 0.8s ease 1.3s;
}

.intro.opened {
  opacity: 0;
  visibility: hidden;
  pointer-events: none;
}

/* SPORTELLO DELLA CASSAFORTE */
.vault-door {
  width: 260px;
  height: 260px;
  border-radius: 50%;
  background: radial-gradient(circle, #8a8a8a, #3a3a3a, #1a1a1a);
  border: 12px solid #d4d4d4;
  box-shadow: 0 0 40px rgba(0,0,0,0.9), inset 0 0 20px rgba(0,0,0,0.8);
  display: flex;
  justify-content: center;
  align-items: center;
  position: relative;
  transform-origin: left center;
  transition: transform 1.2s cubic-bezier(0.4, 0, 0.2, 1) 0.6s, box-shadow 0.3s;
}

.intro:hover .vault-door {
  box-shadow: 0 0 35px rgba(255,255,255,0.4), inset 0 0 20px rgba(0,0,0,0.8);
}

.intro.opened .vault-door {
  transform: rotateY(-105deg);
}

/* CHIAVISTELLI */
.bolt {
  position: absolute;
  width: 35px;
  height: 16px;
  background: linear-gradient(180deg, #ffffff, #888888);
  border-radius: 3px;
  transition: transform 0.4s ease 0.3s;
}
.bolt.right-top { right: -18px; top: 30%; }
.bolt.right-bottom { right: -18px; bottom: 30%; }

.intro.opened .bolt {
  transform: translateX(-20px);
}

/* RUOTA CENTRALE */
.wheel {
  width: 110px;
  height: 110px;
  border-radius: 50%;
  border: 8px solid #e0e0e0;
  position: relative;
  display: flex;
  justify-content: center;
  align-items: center;
  box-shadow: 0 5px 15px rgba(0,0,0,0.6);
  transition: transform 0.6s cubic-bezier(0.68, -0.55, 0.27, 1.55);
}

.spoke {
  position: absolute;
  width: 100%;
  height: 8px;
  background: #e0e0e0;
}
.spoke:nth-child(2) { transform: rotate(60deg); }
.spoke:nth-child(3) { transform: rotate(120deg); }

.wheel-center {
  width: 28px;
  height: 28px;
  border-radius: 50%;
  background: radial-gradient(circle, #fff, #777);
  z-index: 2;
}

.intro.opened .wheel {
  transform: rotate(360deg);
}

.logo-intro{
  font-size: 55px;
  font-weight: 900;
  margin-top: 35px;
  letter-spacing: 5px;
  background: linear-gradient(45deg, #ffffff, #a0a0a0, #ffffff);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  transition: opacity 0.5s ease;
}

.click-hint {
  margin-top: 15px;
  font-size: 14px;
  letter-spacing: 3px;
  color: #aaa;
  text-transform: uppercase;
  animation: pulse 1.5s infinite;
}

.intro.opened .logo-intro,
.intro.opened .click-hint {
  opacity: 0;
}

@keyframes pulse {
  0%, 100% { opacity: 0.4; }
  50% { opacity: 1; }
}

/* NAVBAR */
header{
  position: fixed;
  width: 100%;
  top: 0;
  padding: 20px 60px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  backdrop-filter: blur(20px);
  background: rgba(0,0,0,0.5);
  z-index: 100;
}

header h2{
  font-size: 26px;
  letter-spacing: 2px;
}

nav a{
  text-decoration: none;
  color: white;
  margin-left: 25px;
  font-weight: bold;
  transition: 0.3s;
}

nav a:hover{
  color: #00ff88;
}

/* HERO */
.hero{
  height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  flex-direction: column;
  text-align: center;
  padding: 0 20px;
  background: linear-gradient(180deg, #1c1c1c 0%, #0a0a0a 100%);
}

  font-size: clamp(40px, 8vw, 90px);
  letter-spacing: 6px;
  color: #fff;
  text-shadow: 0 0 20px rgba(0, 255, 136, 0.2);
}

.hero p{
  font-size: 18px;
  color: #aaa;
  margin: 10px 0
