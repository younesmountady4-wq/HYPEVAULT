  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #070707; color: #f5f5f5; font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; line-height: 1.5; }
  .top-strip { background: #00ff88; color: #000; text-align: center; padding: 6px; font-size: 12px; font-weight: 800; letter-spacing: 1px; text-transform: uppercase; }

  .nav-links a { color: #ccc; text-decoration: none; font-size: 13px; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; transition: 0.2s; }
  .nav-links a:hover, .nav-links a.active { color: #00ff88; }

  .container { max-width: 1200px; margin: 0 auto; padding: 40px 20px; }

  .hero h1 { font-size: 48px; letter-spacing: 5px; margin-bottom: 10px; font-weight: 900; text-transform: uppercase; }
  .hero p { color: #999; margin-bottom: 25px; font-size: 15px; max-width: 500px; margin-left: auto; margin-right: auto; }
  .sub-form { display: flex; justify-content: center; gap: 10px; max-width: 420px; margin: 0 auto; }
  .sub-form input { flex: 1; padding: 12px 16px; background: #0b0b0b; border: 1px solid #333; border-radius: 8px; color: #fff; outline: none; }
  .sub-form input:focus { border-color: #00ff88; }
  .btn-neon { padding: 12px 22px; background: #00ff88; color: #000; border: none; border-radius: 8px; font-weight: 900; cursor: pointer; text-transform: uppercase; font-size: 13px; }

  .grid-3 { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; margin-bottom: 60px; }
  .grid-4 { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 20px; margin-bottom: 60px; }
  .look-card { position: relative; border-radius: 14px; overflow: hidden; border: 1px solid #222; height: 360px; background: #111; }
  .look-card img { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform 0.4s; }
  .look-card:hover img { transform: scale(1.04); }
  .look-label { position: absolute; bottom: 14px; left: 14px; background: rgba(10,10,10,0.85); color: #00ff88; border: 1px solid rgba(0,255,136,0.3); padding: 6px 14px; border-radius: 20px; font-size: 11px; font-weight: 800; }
  .title-sec { font-size: 22px; border-left: 4px solid #00ff88; padding-left: 12px; margin-bottom: 25px; text-transform: uppercase; font-weight: 800; letter-spacing: 1px; }
  .card { background: #111; border: 1px solid #222; border-radius: 14px; overflow: hidden; display: flex; flex-direction: column; justify-content: space-between; transition: 0.3s; }
  .card:hover { border-color: #00ff88; transform: translateY(-4px); }
  .card-img { position: relative; height: 230px; background: #1a1a1a; }
  .card-img img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .tag-sconto { position: absolute; top: 10px; left: 10px; background: #00ff88; color: #000; font-weight: 900; font-size: 11px; padding: 4px 10px; border-radius: 6px; }
  .tag-sold { display: none; position: absolute; top: 10px; right: 10px; background: #ff2a55; color: #fff; font-weight: 900; font-size: 11px; padding: 4px 10px; border-radius: 6px; }
  .card-body { padding: 18px; }
  .card-body h4 { margin-bottom: 8px; font-size: 16px; }
  .price-box { margin-bottom: 14px; }
  .old { text-decoration: line-through; color: #666; font-size: 13px; margin-right: 8px; }
  .new { color: #00ff88; font-weight: 800; font-size: 18px; }
  .btn-buy { width: 100%; padding: 11px; background: #1e1e1e; color: #fff; border: 1px solid #333; border-radius: 8px; font-weight: 700; cursor: pointer; text-transform: uppercase; font-size: 12px; transition: 0.2s; }
  .btn-buy:hover:not(:disabled) { background: #00ff88; color: #000; border-color: #00ff88; }
  .btn-buy:disabled { background: #181818; color: #666; border-color: #222; cursor: not-allowed; }
  .restock { display: none; font-size: 11px; color: #ff6b88; margin-top: 8px; background: rgba(255,42,85,0.1); padding: 6px; border-radius: 6px; border-left: 2px solid #ff2a55; }
  footer { border-top: 1px solid #222; padding: 50px 20px 30px; margin-top: 50px; color: #777; font-size: 13px; background: #0b0b0b; }
  .f-grid { max-width: 1200px; margin: 0 auto 30px; display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 20px; }
  .f-grid h4 { color: #fff; margin-bottom: 12px; text-transform: uppercase; font-size: 12px; letter-spacing: 1px; }
  .f-grid p { margin-bottom: 8px; }
  .f-bottom { max-width: 1200px; margin: 0 auto; border-top: 1px solid #1a1a1a; padding-top: 20px; font-size: 12px; color: #666; }
</style>
